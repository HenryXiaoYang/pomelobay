<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = null,content = ~{::content})}"
>
  <th:block th:fragment="content">
    <div
      class="mx-auto w-full max-w-3xl px-6 py-16 sm:px-10"
      th:with="t = ${theme.config?.labels}"
    >
      <h1
        class="text-3xl font-bold sm:text-4xl"
        th:text="${#strings.isEmpty(t?.tags_title) ? 'Tags' : t.tags_title}"
      ></h1>
      <ul class="mt-8 flex flex-wrap gap-2">
        <li th:each="tag : ${tags}">
          <a
            class="badge badge-accent badge-lg"
            th:href="@{${tag.status.permalink}}"
            th:text="${tag.spec.displayName}"
          ></a>
        </li>
      </ul>
    </div>
  </th:block>
</html>
