<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = null,content = ~{::content})}"
>
  <th:block th:fragment="content">
    <article class="mx-auto w-full max-w-3xl px-6 py-16 sm:px-10">
      <h1
        class="text-4xl font-bold leading-tight sm:text-5xl"
        th:text="${singlePage.spec.title}"
      ></h1>
      <div
        class="prose prose-lg mt-10 max-w-none"
        th:utext="${singlePage.content.content}"
      ></div>
    </article>
  </th:block>
</html>
