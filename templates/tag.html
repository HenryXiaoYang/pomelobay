<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = null,content = ~{::content})}"
>
  <th:block th:fragment="content">
    <div class="mx-auto w-full max-w-3xl px-6 py-16 sm:px-10">
      <h1
        class="text-3xl font-bold sm:text-4xl"
        th:text="${tag.spec.displayName}"
      ></h1>
      <div class="mt-8">
        <th:block th:replace="~{partials/post-list :: postList(${posts})}" />
      </div>
      <th:block th:replace="~{partials/pagination :: pagination(${posts})}" />
    </div>
  </th:block>
</html>
